services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: medical_store
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot@123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: yuvrajmedical-app
    container_name: yuvraj_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Root@123
      DB_NAME: medical_store
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMS_OTP_MODE: dev
      FAST2SMS_API_KEY: YgufeB7vxaEXhf8wBHjNOH2UfqWB1tzvB68ATIevJWC9151Rq4IauFBAckOI
    ports:
      - "8000:5000"
    volumes:
      - ./static:/app/static
    networks:
      - medical-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5).read()\""]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
    networks:
      - medical-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiMWZmNDFmYzFhNDhhNGUxYTY4MjI0MDBhM2M2M2JjYTMiLCJ0IjoiZjRlNDc5N2MtMzIzNi00OGY1LWI1OWItYTM4YjY3ZjE5ZGI4IiwicyI6Ik1EQm1NREE0TW1JdFpUaGlZUzAwTmpVM0xXRXlOVFl0Wm1JME5EQmhObUpoWTJZME5qRmtOakEzWWpZdFpEUmtNUzAwWXpOakxUZzVZVGN0WWpZNE9XTXdNR1U1T0RKaCJ9
    depends_on:
      - nginx
    networks:
      - medical-network

volumes:
  mysql-data:

networks:
  medical-network:
