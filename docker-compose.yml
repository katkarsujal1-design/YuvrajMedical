services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: medical_store
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - medical-network
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: yuvrajmedical-app
    container_name: yuvraj_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TZ: UTC
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: medical_store
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_TEST_OTP: ${SMS_TEST_OTP:-123456}
      TWOFACTOR_API_KEY: ${TWOFACTOR_API_KEY:-}
      TWOFACTOR_OTP_MODE: ${TWOFACTOR_OTP_MODE:-manual_sms}
      TWOFACTOR_OTP_TRANSPORT: ${TWOFACTOR_OTP_TRANSPORT:-otp_sms}
      TWOFACTOR_OTP_CHANNEL: ${TWOFACTOR_OTP_CHANNEL:-SMS}
      TWOFACTOR_OTP_URL: ${TWOFACTOR_OTP_URL:-https://2factor.in/API/V1/OTP/SEND}
      TWOFACTOR_LEGACY_URL: ${TWOFACTOR_LEGACY_URL:-https://2factor.in/API/V1}
      TWOFACTOR_VERIFY_URL: ${TWOFACTOR_VERIFY_URL:-https://2factor.in/API/V1}
      TWOFACTOR_OTP_TEMPLATE: ${TWOFACTOR_OTP_TEMPLATE:-}
      TWOFACTOR_OTP_MESSAGE: "${TWOFACTOR_OTP_MESSAGE:-Yuvraj Medical CMS OTP: {otp} is your secure verification code. Please do not share it.}"
      TWOFACTOR_TRANSACTIONAL_TEMPLATE: ${TWOFACTOR_TRANSACTIONAL_TEMPLATE:-}
      TWOFACTOR_SENDER_ID: ${TWOFACTOR_SENDER_ID:-}
      TWOFACTOR_ENTITY_ID: ${TWOFACTOR_ENTITY_ID:-}
      TWOFACTOR_TEMPLATE_ORDER_CONFIRMED: ${TWOFACTOR_TEMPLATE_ORDER_CONFIRMED:-}
      TWOFACTOR_TEMPLATE_ORDER_DELIVERED: ${TWOFACTOR_TEMPLATE_ORDER_DELIVERED:-}
      TWOFACTOR_TEMPLATE_PAYMENT_SUCCESSFUL: ${TWOFACTOR_TEMPLATE_PAYMENT_SUCCESSFUL:-}
      TWOFACTOR_TEMPLATE_PRESCRIPTION_APPROVED: ${TWOFACTOR_TEMPLATE_PRESCRIPTION_APPROVED:-}
    ports:
      - "8000:5000"
    volumes:
      - ./static:/app/static
    networks:
      - medical-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5).read()\""]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
    networks:
      - medical-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - medical-network

volumes:
  mysql-data:

networks:
  medical-network:
