<!DOCTYPE html>
<html>
<head>
    <title>Scan Medicine Barcode</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/site_header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page_animations.css') }}">
    <style>
        body{
            font-family:Arial;
            background:linear-gradient(135deg,#dbeafe,#f8fafc,#ede9fe);
            min-height:100vh;
            margin:0;
            padding:25px;
            text-align:center;
        }

        .card{
            max-width:520px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:24px;
            box-shadow:0 20px 45px rgba(0,0,0,0.12);
        }

        h2{
            color:#0f172a;
        }

        #reader{
            width:100%;
            max-width:420px;
            margin:20px auto;
            border-radius:18px;
            overflow:hidden;
        }

        .hint{
            color:#64748b;
            font-size:14px;
            margin-top:10px;
        }

        .manual-box{
            margin-top:22px;
            padding-top:18px;
            border-top:1px solid #e2e8f0;
        }

        input{
            width:100%;
            padding:14px;
            border-radius:14px;
            border:1px solid #cbd5e1;
            font-size:16px;
            margin-top:10px;
        }

        button{
            width:100%;
            margin-top:12px;
            padding:14px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#6366f1,#06b6d4);
            color:white;
            font-weight:800;
            font-size:15px;
            cursor:pointer;
        }

        a{
            display:block;
            margin-top:18px;
            text-decoration:none;
            color:#6366f1;
            font-weight:700;
        }

        #result{
            font-weight:800;
            color:#16a34a;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium_theme.css') }}">
</head>
<body class="yvm-pro-page yvm-page-scan-barcode">

<div class="bg-particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="card">

    <h2>📷 Scan Medicine Barcode</h2>

    <p class="hint">
        Point camera clearly at barcode. Use good light and keep barcode inside box.
    </p>

    <div id="reader"></div>

    <p id="result">Waiting for barcode...</p>

    <div class="manual-box">
        <h3>⌨️ Or Enter Barcode Manually</h3>

        <input
            type="text"
            id="manualBarcode"
            placeholder="Enter barcode number"
        >

        <button onclick="goManual()">
            Search / Add Barcode
        </button>
    </div>

    <a href="/staff">⬅ Back to Staff</a>

</div>

<script>
    let alreadyScanned = false;

    function onScanSuccess(decodedText, decodedResult) {
        if (alreadyScanned) return;

        alreadyScanned = true;

        document.getElementById("result").innerHTML =
            "Barcode scanned: " + decodedText;

        window.location.href =
            "/barcode_result/" + encodeURIComponent(decodedText);
    }

    function onScanFailure(error) {
        // ignore scanning errors
    }

    const formatsToSupport = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF
    ];

    let scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 15,
            qrbox: {
                width: 320,
                height: 160
            },
            aspectRatio: 1.777,
            formatsToSupport: formatsToSupport
        },
        false
    );

    scanner.render(onScanSuccess, onScanFailure);

    function goManual(){
        let code = document.getElementById("manualBarcode").value.trim();

        if(code === ""){
            alert("Please enter barcode number");
            return;
        }

        window.location.href =
            "/barcode_result/" + encodeURIComponent(code);
    }
</script>

<script src="{{ url_for('static', filename='js/page_animations.js') }}"></script>
</body>
</html>
