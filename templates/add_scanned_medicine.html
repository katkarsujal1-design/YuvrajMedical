<!DOCTYPE html>
<html>
<head>
    <title>Add Scanned Medicine</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/site_header.css') }}">

<style>
        body{
            font-family:Arial;
            background:linear-gradient(135deg,#dbeafe,#f8fafc,#ede9fe);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:500px;
            background:white;
            padding:28px;
            border-radius:24px;
            box-shadow:0 20px 45px rgba(0,0,0,0.12);
        }

        h2{
            text-align:center;
            color:#0f172a;
            margin-bottom:10px;
        }

        .barcode-box{
            background:#f1f5f9;
            padding:14px;
            border-radius:16px;
            text-align:center;
            font-weight:800;
            margin-bottom:20px;
            color:#6366f1;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:14px;
            border-radius:14px;
            border:1px solid #cbd5e1;
            font-size:15px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#6366f1,#06b6d4);
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }

        a{
            display:block;
            text-align:center;
            margin-top:16px;
            text-decoration:none;
            color:#6366f1;
            font-weight:700;
        }
    </style>
</head>
<body class="yvm-pro-page yvm-page-add-scanned-medicine">

<div class="card">

    <h2>➕ Add New Scanned Medicine</h2>

    <div class="barcode-box">
        Scanned Barcode: {{ barcode }}
    </div>

    <form method="POST">

        <input
            name="barcode"
            value="{{ barcode }}"
            readonly
        >

        <input
            name="name"
            placeholder="Medicine Name"
            required
        >

        <input
            name="category"
            placeholder="Category"
        >

        <input
            type="number"
            name="price"
            placeholder="Price"
            required
        >

        <input
            type="number"
            name="stock"
            placeholder="Stock"
            required
        >

        <input
            type="date"
            name="expiry"
        >

        <button>
            ✅ Add Medicine to Database
        </button>

    </form>

    <a href="/scan_barcode">🔄 Scan Again</a>
    <a href="/staff">⬅ Back to Staff</a>

</div>

</body>
</html>
