<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site_header.css') }}">

    <style>
        body { margin:0; font-family: Arial; background:linear-gradient(135deg,#f8fafc,#eef7f5); }
        .card {
            width:400px;
            max-width:calc(100% - 32px);
            margin:32px auto 50px;
            background:white;
            padding:20px;
            border-radius:8px;
            border:1px solid #dbe4f0;
            box-shadow:0 18px 42px rgba(15,23,42,.08);
        }
        input {
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:6px;
        }
        button {
            width:100%;
            padding:10px;
            background:#2c7be5;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>

<body class="yvm-pro-page yvm-page-edit-profile">
{% include "partials/site_header.html" %}

<div class="card">
    <h2>Edit Profile</h2>

    <form method="POST">

        <input type="text" name="name" value="{{ user['name'] }}" required>

        <input type="text" name="phone" value="{{ user['phone'] }}" required>

        <input type="text" name="address" value="{{ user['address'] }}" required>

        <button type="submit">Save Changes</button>

    </form>
</div>

{% include "partials/site_header_script.html" %}
</body>
</html>
