<!DOCTYPE html>
<html>
<head>
    <title>Upload Prescription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            margin: 0;
            padding: 0;
        }

        .box {
            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 14px;
        }

        input[type="file"] {
            margin: 20px 0;
            width: 100%;
            padding: 12px;
            border: 1px dashed #2563eb;
            border-radius: 10px;
            background: #f8fbff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Upload Prescription</h2>
    <p>Upload your prescription image. Our staff will verify it before confirming medicines.</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="prescription" accept="image/*" required>
        <button type="submit">Upload Prescription</button>
    </form>

    <a href="/">Back to Home</a>
</div>

</body>
</html>
